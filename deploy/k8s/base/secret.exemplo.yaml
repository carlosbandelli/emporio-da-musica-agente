# EXEMPLO com placeholders. Não contém segredos reais e NÃO deve ser aplicado em produção.
# Em produção, o Secret "emporio-segredos" é criado por External Secrets Operator (ex.: a partir
# do Secrets Manager do provedor) ou Sealed Secrets. O overlay "producao" remove este arquivo.
apiVersion: v1
kind: Secret
metadata:
  name: emporio-segredos
type: Opaque
stringData:
  # Postgres gerenciado, com TLS. Schema "emporio" criado pela migração.
  DATABASE_URL: "postgresql+psycopg://TROCAR_USUARIO:TROCAR_SENHA@TROCAR_HOST_POSTGRES:5432/emporio?sslmode=require"
  # Redis gerenciado, com TLS (rediss://) e autenticação.
  REDIS_URL: "rediss://:TROCAR_SENHA@TROCAR_HOST_REDIS:6380/0"
  GOOGLE_API_KEY: "TROCAR_GOOGLE_API_KEY"
  GROQ_API_KEY: "TROCAR_GROQ_API_KEY"
  ANTHROPIC_API_KEY: "TROCAR_ANTHROPIC_API_KEY"
  JWT_SECRET: "TROCAR_POR_SEGREDO_LONGO_ALEATORIO"
  # Opcional: sem DSN, o Sentry não é ativado.
  SENTRY_DSN: ""
