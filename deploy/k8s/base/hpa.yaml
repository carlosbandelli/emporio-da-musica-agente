# HPA: escalonamento horizontal por CPU e memória (requer metrics-server).
# O HPA é a fonte de verdade do número de réplicas: não usar "replicas" fixo em produção.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: emporio-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: emporio-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      # Janela longa: evita oscilar com picos de chat.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
