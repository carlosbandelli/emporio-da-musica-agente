# Prometheus: raspa a app (réplicas descobertas pelo DNS do serviço "app"), o Traefik .
# /metrics da app é raspado pela rede interna. Nunca passa pelo Traefik.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: emporio-app
    metrics_path: /metrics
    # No compose, o nome do serviço resolve para o IP de todas as réplicas.
    dns_sd_configs:
      - names: ["app"]
        type: A
        port: 8000
        refresh_interval: 30s

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]
