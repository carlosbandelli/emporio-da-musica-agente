# Ambiente local do Empório da Música.
#
# Essencial (Traefik + app em réplicas + Postgres + Redis + migração + Prometheus):
#   docker compose up -d --build
# Prometheus já sobe no conjunto essencial (raspa /metrics da app e do Traefik).
# Perfil opcional (OTel Collector, Loki, Alloy):
#   docker compose --profile observabilidade up -d --build
# Grafana e Sentry ficaram para o futuro (deploy/observabilidade/grafana/README.md).
# Escalar a app (horizontal):
#   APP_REPLICAS=5 docker compose up -d        (ou: docker compose up -d --scale app=5)
#
# Segredos ficam no .env (copie de .env.example). Este arquivo não contém segredos reais.
# Entrada única: http://localhost (o Traefik é o único serviço com porta publicada).

name: emporio

# Bloco comum da app e da migração (mesma imagem, mesmo build).
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  image: emporio:local
  env_file:
    - path: .env
      required: false
  # environment sobrescreve o .env: dentro do compose, os hosts são os nomes dos serviços.
  environment:
    DATABASE_URL: postgresql+psycopg://emporio:${POSTGRES_PASSWORD:-emporio-dev}@postgres:5432/emporio
    REDIS_URL: redis://redis:6379/0
    # Vazio = sem traces. Com o perfil observabilidade: OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  networks:
    - borda
    - dados
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # Borda: load balancer, reverse proxy e API gateway
  # ---------------------------------------------------------------------------
  traefik:
    # v3.6+: o cliente Docker das versões anteriores é rejeitado pelo Docker Engine 29 (API mínima 1.44).
    image: traefik:v3.6
    command:
      - --log.level=INFO
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      # Provider Docker: descobre as réplicas da app pelas labels. Só expõe o que tiver traefik.enable=true.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=borda
      - --entrypoints.web.address=:80
      # TLS (opcional, ver comentários abaixo): --entrypoints.websecure.address=:443
      # Entrada interna para métricas e health. Não é publicada, então /metrics do Traefik não é público.
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
      - --metrics.prometheus.addrouterslabels=true
      - --ping=true
      - --ping.entryPoint=metrics
      # Dashboard: acessível só via router com basic auth (label traefik.http.routers.traefik.*).
      - --api.dashboard=true
      # Let's Encrypt (produção com domínio público). Descomente e ajuste o e-mail:
      # - --entrypoints.websecure.address=:443
      # - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-voce@exemplo.com}
      # - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/usuarios.htpasswd:/etc/traefik/usuarios.htpasswd:ro
      # - ./deploy/traefik/letsencrypt:/letsencrypt
    healthcheck:
      # O healthcheck é outro processo: repete as flags do entrypoint de ping.
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entryPoint=metrics", "--entryPoints.metrics.address=:8082"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - borda
      - dados
    labels:
      - traefik.enable=true
      # Middlewares de borda, definidos aqui e referenciados nos routers por "nome@docker".
      # Rate limit por IP: 20 req/s com rajada de 60. Cuidado com NAT de operadora (muitos clientes por IP).
      - traefik.http.middlewares.gw-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.gw-ratelimit.ratelimit.burst=60
      - traefik.http.middlewares.gw-ratelimit.ratelimit.period=1s
      # Headers de segurança
      - traefik.http.middlewares.gw-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.gw-headers.headers.framedeny=true
      - traefik.http.middlewares.gw-headers.headers.referrerpolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.gw-headers.headers.stsseconds=31536000
      - traefik.http.middlewares.gw-headers.headers.customresponseheaders.server=
      # Compressão
      - traefik.http.middlewares.gw-compress.compress=true
      # Basic auth de exemplo (usuário admin / senha troque-esta-senha; troque antes de usar em qualquer lugar real)
      - traefik.http.middlewares.auth-operacao.basicauth.usersfile=/etc/traefik/usuarios.htpasswd
      - traefik.http.middlewares.auth-operacao.basicauth.removeheader=true
      # Dashboard do Traefik em /traefik/dashboard/ (prefixo removido antes do api@internal)
      - traefik.http.middlewares.traefik-strip.stripprefix.prefixes=/traefik
      - traefik.http.routers.traefik.rule=PathPrefix(`/traefik`)
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=traefik-strip@docker,auth-operacao@docker,gw-headers@docker

  # ---------------------------------------------------------------------------
  # Aplicação: N réplicas stateless atrás do Traefik
  # ---------------------------------------------------------------------------
  app:
    <<: *app
    expose:
      - "8000"
    deploy:
      replicas: ${APP_REPLICAS:-3}
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=borda
      # Só /v1/*, /health e /ready são roteados. /metrics NÃO passa pela borda (Prometheus raspa pela rede interna).
      - traefik.http.routers.app.rule=PathPrefix(`/v1`)
      - traefik.http.routers.app.entrypoints=web
      - traefik.http.routers.app.middlewares=gw-ratelimit@docker,gw-headers@docker,gw-compress@docker
      - traefik.http.routers.app-sonda.rule=Path(`/health`) || Path(`/ready`)
      - traefik.http.routers.app-sonda.entrypoints=web
      - traefik.http.routers.app-sonda.service=app
      - traefik.http.routers.app-sonda.middlewares=gw-headers@docker
      # Sem retry no gateway: cada tentativa de POST /v1/chat custa uma chamada de LLM (resiliência fica na app).
      - traefik.http.services.app.loadbalancer.server.port=8000
      # Health ativo do Traefik: tira da rotação a réplica que não responde (liveness). Sem sticky sessions.
      - traefik.http.services.app.loadbalancer.healthcheck.path=/health
      - traefik.http.services.app.loadbalancer.healthcheck.interval=10s

  # Migração e seed: one-shot, roda antes da app. Usa advisory lock, então várias réplicas não colidem.
  migrate:
    <<: *app
    command: ["python", "-m", "emporio.adaptadores.db.migrar"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Dados (rede interna, sem saída para a internet)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emporio
      POSTGRES_USER: emporio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emporio-dev}
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emporio -d emporio"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - dados
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF ligado: sessões e token buckets são fonte da verdade (arquitetura §5.3).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dados
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Observabilidade (perfil "observabilidade")
  # ---------------------------------------------------------------------------
  otel-collector:
    profiles: ["observabilidade"]
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observabilidade/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - dados
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-dados:/prometheus
    networks:
      - dados
    restart: unless-stopped

  loki:
    profiles: ["observabilidade"]
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/observabilidade/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-dados:/loki
    networks:
      - dados
    restart: unless-stopped

  # Coleta dos logs de todos os contêineres (stdout) e envio ao Loki. Substitui o Promtail, que está descontinuado.
  alloy:
    profiles: ["observabilidade"]
    image: grafana/alloy:v1.11.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/observabilidade/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Leitura do socket do Docker: dá acesso amplo ao host. Em produção, use um socket-proxy.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-dados:/var/lib/alloy/data
    networks:
      - dados
    restart: unless-stopped

networks:
  # Borda: única rede com porta publicada (Traefik) e com saída para a internet (LLMs).
  borda: {}
  # Dados: sem saída para a internet. Postgres, Redis, observabilidade ficam isolados.
  # A app também está na borda, então as chamadas aos provedores de LLM continuam funcionando.
  dados:
    internal: true

volumes:
  postgres-dados:
  redis-dados:
  prometheus-dados:
  loki-dados:
  alloy-dados:
