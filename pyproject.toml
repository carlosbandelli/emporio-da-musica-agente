[project]
name = "emporio"
version = "0.1.0"
description = "Agente de atendimento por texto (Sônia) da Empório da Música."
requires-python = ">=3.12"
dependencies = [
    "babel>=2.17",
    "holidays>=0.107",
    "pydantic-settings>=2.16.2",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
    "typer>=0.12",
    "groq>=1.7.0",
    "google-genai>=2.34.0",
    "anthropic>=2.3.0",
    "tenacity>=9.1.4",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "sqlalchemy>=2.1.6",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.1",
    "redis>=8.1.0",
    "pyjwt>=2.15.1",
    "httpx>=0.28.1",
]

[project.scripts]
emporio = "emporio.adaptadores.cli:app"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "types-pyyaml>=6.0.12.20261030",
    "fakeredis>=2.40.0",
    "testcontainers[postgres,redis]>=4.15.0",
    "httpx>=0.28.1",
    "asgi-lifespan>=2.1.0",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PL"]
ignore = [
    "PLR0913",  # muitos argumentos: comum em casos de uso com injeção explícita
    "RUF001",   # caracteres ambíguos em strings (acentos pt-BR)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"
# O ruff 0.17 também formata blocos de código dentro de Markdown; a documentação em docs/ fica fora.
exclude = ["*.md"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm_real: testes que chamam LLM real (pulados sem chave)",
]

# ---------------------------------------------------------------------------
# import-linter: regras de dependência (só para dentro). Ordem, de fora para dentro:
#   composicao -> adaptadores -> modulos.*.aplicacao -> portas -> modulos.*.dominio (+ modulos.comum)
# `portas` fica entre `aplicacao` e `dominio` dos mesmos pacotes, então um contrato `layers` único não
# expressa a ordem; por isso usamos contratos `forbidden`.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "emporio"
include_external_packages = true

# --- C1: camadas ---------------------------------------------------------
[[tool.importlinter.contracts]]
name = "C1a - dominio e comum nao importam portas, adaptadores, composicao nem aplicacao"
type = "forbidden"
source_modules = ["emporio.modulos.*.dominio", "emporio.modulos.comum"]
forbidden_modules = [
    "emporio.portas",
    "emporio.adaptadores",
    "emporio.composicao",
    "emporio.modulos.*.aplicacao",
]

[[tool.importlinter.contracts]]
name = "C1b - portas nao importam adaptadores, composicao nem aplicacao"
type = "forbidden"
source_modules = ["emporio.portas"]
forbidden_modules = [
    "emporio.adaptadores",
    "emporio.configuracao",
    "emporio.composicao",
    "emporio.modulos.*.aplicacao",
]

[[tool.importlinter.contracts]]
name = "C1c - modulos nao importam adaptadores nem composicao"
type = "forbidden"
source_modules = ["emporio.modulos"]
forbidden_modules = ["emporio.adaptadores", "emporio.composicao", "emporio.configuracao"]

[[tool.importlinter.contracts]]
name = "C1d - adaptadores nao importam composicao"
type = "forbidden"
source_modules = ["emporio.adaptadores"]
forbidden_modules = ["emporio.composicao"]
# Exceção única: os adaptadores de entrada recebem o motor pela composição (C4, arquitetura §3.3).
ignore_imports = [
    "emporio.adaptadores.cli -> emporio.composicao",
    "emporio.adaptadores.api.app -> emporio.composicao",
]

# --- C2: sem SDKs/frameworks externos em modulos e portas -----------------
[[tool.importlinter.contracts]]
name = "C2 - modulos e portas nao importam SDKs ou frameworks externos"
type = "forbidden"
source_modules = ["emporio.modulos", "emporio.portas"]
forbidden_modules = [
    "groq",
    "google",
    "anthropic",
    "httpx",
    "sqlalchemy",
    "redis",
    "fastapi",
    "typer",
    "jwt",
]

# --- C3: um modulo nunca importa o dominio de outro -----------------------
# `emporio.modulos.comum` e permitido para todos. Imports indiretos (via aplicacao) sao permitidos.
[[tool.importlinter.contracts]]
name = "C3 - catalogo nao importa o dominio de outros modulos"
type = "forbidden"
source_modules = ["emporio.modulos.catalogo"]
forbidden_modules = [
    "emporio.modulos.comercial.dominio",
    "emporio.modulos.pedidos.dominio",
    "emporio.modulos.politicas.dominio",
    "emporio.modulos.atendimento.dominio",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "C3 - comercial nao importa o dominio de outros modulos"
type = "forbidden"
source_modules = ["emporio.modulos.comercial"]
forbidden_modules = [
    "emporio.modulos.catalogo.dominio",
    "emporio.modulos.pedidos.dominio",
    "emporio.modulos.politicas.dominio",
    "emporio.modulos.atendimento.dominio",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "C3 - pedidos nao importa o dominio de outros modulos"
type = "forbidden"
source_modules = ["emporio.modulos.pedidos"]
forbidden_modules = [
    "emporio.modulos.catalogo.dominio",
    "emporio.modulos.comercial.dominio",
    "emporio.modulos.politicas.dominio",
    "emporio.modulos.atendimento.dominio",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "C3 - politicas nao importa o dominio de outros modulos"
type = "forbidden"
source_modules = ["emporio.modulos.politicas"]
forbidden_modules = [
    "emporio.modulos.catalogo.dominio",
    "emporio.modulos.comercial.dominio",
    "emporio.modulos.pedidos.dominio",
    "emporio.modulos.atendimento.dominio",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "C3 - atendimento nao importa o dominio de outros modulos"
type = "forbidden"
source_modules = ["emporio.modulos.atendimento"]
forbidden_modules = [
    "emporio.modulos.catalogo.dominio",
    "emporio.modulos.comercial.dominio",
    "emporio.modulos.pedidos.dominio",
    "emporio.modulos.politicas.dominio",
]
allow_indirect_imports = true

# --- C4: adaptadores de entrada so conhecem portas e composicao -----------
# `composicao` importa tudo, por isso imports indiretos sao permitidos.
[[tool.importlinter.contracts]]
name = "C4 - CLI e API nao importam modulos nem outros adaptadores"
type = "forbidden"
source_modules = ["emporio.adaptadores.cli", "emporio.adaptadores.api"]
forbidden_modules = [
    "emporio.modulos",
    "emporio.adaptadores.llm",
    "emporio.adaptadores.csv",
    "emporio.adaptadores.memoria",
    "emporio.adaptadores.motor",
    "emporio.adaptadores.observabilidade",
    "emporio.adaptadores.db",
    "emporio.adaptadores.redis",
    "emporio.adaptadores.identidade",
    "emporio.adaptadores.pagamento",
]
allow_indirect_imports = true

# --- C5m: motores independentes entre si (task 2.7) -------------------------
# O que os dois motores compartilham (guarda de valores, mensagens fixas, idioma, histórico, prompt) fica em
# `motor.comum`, que não conhece nenhum motor.
[[tool.importlinter.contracts]]
name = "C5m - motores nativo e n8n independentes entre si"
type = "independence"
modules = [
    "emporio.adaptadores.motor.nativo",
    "emporio.adaptadores.motor.n8n",
]

[[tool.importlinter.contracts]]
name = "C5m - motor.comum nao importa nenhum motor"
type = "forbidden"
source_modules = ["emporio.adaptadores.motor.comum"]
forbidden_modules = ["emporio.adaptadores.motor.nativo", "emporio.adaptadores.motor.n8n"]

# --- C5: adaptadores independentes entre si -------------------------------
# Fase 2: acrescentar db, redis e motor.n8n quando existirem (api já está).
[[tool.importlinter.contracts]]
name = "C5 - adaptadores independentes entre si"
type = "independence"
modules = [
    "emporio.adaptadores.cli",
    "emporio.adaptadores.api",
    "emporio.adaptadores.motor",
    "emporio.adaptadores.llm",
    "emporio.adaptadores.csv",
    "emporio.adaptadores.memoria",
    "emporio.adaptadores.relogio",
    "emporio.adaptadores.redis",
    "emporio.adaptadores.db",
    "emporio.adaptadores.observabilidade",
    "emporio.adaptadores.identidade",
    "emporio.adaptadores.pagamento",
]
# A CLI e a API chegam aos outros adaptadores só através da composição (C4); essa é a única aresta permitida.
ignore_imports = [
    "emporio.adaptadores.cli -> emporio.composicao",
    "emporio.adaptadores.api.app -> emporio.composicao",
]
